name: Read-only archived source observations
on:
  workflow_call:
    inputs:
      source_run_id: {type: string, required: true}
      source_revision: {type: string, required: true}
      profile: {type: string, required: false, default: short-control}
permissions:
  contents: read
  actions: read
jobs:
  native-observation:
    name: qualification/source-control (${{ matrix.arch }})
    if: ${{ inputs.profile == 'short-control' && github.event_name == 'workflow_dispatch' && github.repository == 'beetlestance/beetle-lab' && github.ref == 'refs/heads/rewrite/integration' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    env:
      BEETLE_QUALIFICATION_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '24', cache: npm}
      - run: npm ci --ignore-scripts
      - name: Verify all twelve source gates and reuse the native image archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: node --import tsx tools/qualification/native-application/load/stage.ts "$SOURCE_RUN" "$SOURCE_REVISION" "$RUNNER_TEMP/source-stage"
      - name: Observe bounded native idle loaded and post-idle windows
        id: observation
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root = process.env.RUNNER_TEMP;
          writeFileSync(join(root, 'observation-plan.json'), JSON.stringify({cwd: process.cwd(), checks: [{id: 'short-control', timeoutMs: 180000,
            argv: [process.execPath, '--import', 'tsx', 'tools/qualification/native-application/load/run.ts',
              join(root, 'source-stage/images/bundle.json'), join(root, 'short-control')]}]}), {flag: 'wx', mode: 0o600});
          JS
          node --import tsx tools/check-runner/cli.ts "$RUNNER_TEMP/observation-plan.json" "$RUNNER_TEMP/observation-checks"
      - name: Independently remove only owned observation resources
        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 4
        run: |
          if [ -f "$RUNNER_TEMP/short-control/owner.json" ]; then
            node --import tsx tools/qualification/native-application/cold/cleanup.ts "$RUNNER_TEMP/short-control"
          fi
      - name: Project only closed observation facts
        if: ${{ always() }}
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          BEETLE_OBSERVATION_EXECUTION: ${{ steps.observation.outcome }}
          BEETLE_OBSERVATION_CLEANUP: ${{ steps.cleanup.outcome }}
        run: node --import tsx tools/qualification/native-application/load/public.ts "$RUNNER_TEMP/short-control/outcome-private.json" "$SOURCE_REVISION" "$RUNNER_TEMP/short-control/public-outcome.json"
      - name: Retain only the public short-window report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: short-control-${{ matrix.arch }}
          path: ${{ runner.temp }}/short-control/public-outcome.json
          if-no-files-found: error
          retention-days: 7

  missing-amd64:
    name: qualification/missing-amd64
    if: ${{ contains(fromJSON('["missing-amd64","conformance-amd64","repeated-memory-amd64","long-amd64","rss-amd64"]'), inputs.profile) && github.event_name == 'workflow_dispatch' && github.repository == 'beetlestance/beetle-lab' && github.ref == 'refs/heads/rewrite/integration' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rewrite-conformance.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_revision: ${{ inputs.source_revision }}
      profile: ${{ inputs.profile }}

  telemetry-amd64:
    name: qualification/telemetry-amd64
    if: ${{ inputs.profile == 'telemetry-amd64' && github.event_name == 'workflow_dispatch' && github.repository == 'beetlestance/beetle-lab' && github.ref == 'refs/heads/rewrite/integration' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rewrite-telemetry.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      source_revision: ${{ inputs.source_revision }}
