name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    name: ci/source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:legacy
      - name: Check generated contracts, API and compiler
        run: |
          npm run check:contracts
          npm run check:api
          npm run check:k6
      - run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=2048
      - run: npm run lint
      - run: npm run check:architecture
      - run: npm run check:docs
      - run: npm run build:web
      - run: npm run build:api
      - run: npm run smoke:api
      - run: npm run smoke:input-controls


  tests:
    name: ci/tests (${{ matrix.shard }}/6)
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      NODE_OPTIONS: --max-old-space-size=1024
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the assigned rewrite test shard
        run: npm run test:v2 -- --shard=${{ matrix.shard }}/6 --reporter=default

  checks:
    name: ci/checks
    if: ${{ always() }}
    needs: [source, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful source checks and every test shard
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$TEST_RESULT" = success

  legacy-container:
    name: ci/legacy-container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: beetle-lab:smoke
          cache-from: type=gha,scope=beetle-lab-amd64
          cache-to: type=gha,mode=max,scope=beetle-lab-amd64
      - name: Check HTTP API and execute k6 inside the image
        run: bash scripts/container-smoke.sh beetle-lab:smoke

  rewrite-container:
    name: ci/rewrite-container (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            cpu-period=100000
            cpu-quota=200000
            memory=2147483648
            memory-swap=2147483648
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Build candidate frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          target: frontend
          load: true
          push: false
          tags: beetle-candidate-frontend:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-frontend-${{ matrix.arch }}
      - name: Build candidate backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          target: backend
          load: true
          push: false
          tags: beetle-candidate-backend:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-backend-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-backend-${{ matrix.arch }}
      - name: Build candidate agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: agent/Dockerfile
          target: agent
          load: true
          push: false
          tags: beetle-candidate-agent:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-agent-${{ matrix.arch }}
      - name: Build candidate installer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/install/Dockerfile
          target: installer
          load: true
          push: false
          tags: beetle-candidate-installer:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-installer-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-installer-${{ matrix.arch }}
      - name: Build candidate engine
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engines/k6/Dockerfile
          target: engine
          load: true
          push: false
          tags: beetle-candidate-engine:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-engine-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-engine-${{ matrix.arch }}
      - name: Build candidate export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: engines/k6/Dockerfile
          target: export-engine
          load: true
          push: false
          tags: beetle-candidate-export:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=rewrite-export-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=rewrite-export-${{ matrix.arch }}
      - name: Qualify the matched candidate stack with isolated synthetic data
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
          BEETLE_QUALIFICATION_REVISION: ${{ github.sha }}
          BEETLE_QUALIFICATION_ARCHITECTURE: ${{ matrix.arch }}
          TMPDIR: ${{ runner.temp }}
        run: |
          node --import tsx tools/qualification/native-application/compose/smoke.ts \
            "beetle-candidate-frontend:$CANDIDATE_REVISION" \
            "beetle-candidate-backend:$CANDIDATE_REVISION" \
            "beetle-candidate-agent:$CANDIDATE_REVISION" \
            "beetle-candidate-installer:$CANDIDATE_REVISION" \
            "beetle-candidate-engine:$CANDIDATE_REVISION" \
            "beetle-candidate-export:$CANDIDATE_REVISION"
      - name: Retain native qualification outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrite-native-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/beetle-compose-evidence-*/outcome.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install pinned image scanner
        run: bash scripts/install-ci-trivy.sh "$RUNNER_TEMP/beetle-trivy"
      - name: Inventory dependencies and gate candidate image vulnerabilities
        env:
          CANDIDATE_REVISION: ${{ github.sha }}
          CANDIDATE_ARCHITECTURE: ${{ matrix.arch }}
        run: |
          bash scripts/rewrite-supply-chain.sh "$CANDIDATE_REVISION" "$CANDIDATE_ARCHITECTURE" \
            "$RUNNER_TEMP/beetle-trivy/trivy" "$RUNNER_TEMP/rewrite-supply-chain"
      - name: Retain image identities, SBOMs, license and vulnerability reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rewrite-supply-chain-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/rewrite-supply-chain/*.*
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

  container:
    name: ci/container
    if: ${{ always() }}
    needs: [checks, legacy-container, rewrite-container]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require legacy and rewrite image qualification
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          LEGACY_RESULT: ${{ needs.legacy-container.result }}
          REWRITE_RESULT: ${{ needs.rewrite-container.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$LEGACY_RESULT" = success
          test "$REWRITE_RESULT" = success

  publish:
    name: Publish container
    needs: [checks, container]
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'beetlestance/beetle-lab' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/beetlestance/beetle-lab
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Publish amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=beetle-lab-amd64
            type=gha,scope=beetle-lab-multiarch
          cache-to: type=gha,mode=max,scope=beetle-lab-multiarch
